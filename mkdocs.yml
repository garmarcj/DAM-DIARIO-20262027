site_name: Diario
site_url: https://garmarcj.github.io/DAM-DIARIO-20262027/
site_author: Cristian Garcia
theme:
  name: material
  language: es
  palette:
    scheme: default
    primary: red
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.top
    - navigation.sections
    - search.highlight
    - search.suggest
    - toc.integrate
nav:
  - Presentación: index.md
  - Dia 1: diario001.md
  - Día 2: diario002.md
  - Día 3: diario003.md
  - Dia 4: diario004.md
  - Día 5: diario005.md
  - Día 6: diario006.md
  - Día 7: diario007.md
  - Día 8: diario008.md
  - Día 9: diario009.md
  - Día 10: diario010.md
markdown_extensions:
  - attr_list
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed
extra_css:
  - stylesheets/extra.css
use_directory_urls: false
